<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details — BlueSky Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        openseaDark: '#04111d',
                        openseaCard: '#262b2f',
                        openseaBlue: '#2081e2',
                        openseaHover: '#1868b7'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-openseaDark text-white font-sans antialiased">
    <nav class="flex items-center justify-between px-6 py-4 border-b border-gray-800 sticky top-0 bg-openseaDark/90 backdrop-blur-md z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 bg-openseaBlue rounded-full flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <span class="text-xl font-bold">BlueSky</span>
        </div>
        <div class="flex items-center space-x-6 text-sm font-medium">
            <a href="index.html" class="hover:text-openseaBlue transition">Home</a>
            <a href="explore.html" class="hover:text-openseaBlue transition">Explore</a>
            <a href="profile.html" class="hover:text-openseaBlue transition">Profile</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <!-- Left: Asset Image / Preview -->
            <div class="bg-openseaCard border border-gray-800 rounded-2xl overflow-hidden p-4">
                <div class="h-96 bg-cover bg-center rounded-xl" style="background-image: url('https://images.unsplash.com/photo-1620641788421-7a1c3424e2q=80&w=500&auto=format&fit=crop');"></div>
            </div>

            <!-- Right: Details & Purchase Actions -->
            <div class="space-y-6">
                <div>
                    <span class="text-xs text-openseaBlue uppercase tracking-widest font-bold">Polygon Unfiltered Collection</span>
                    <h1 class="text-3xl font-extrabold mt-1">Prism Core #0192</h1>
                    <p class="text-gray-400 text-sm mt-2">Owned by <span class="text-openseaBlue font-mono">0x89C7...34F2</span></p>
                </div>

                <div class="bg-openseaCard border border-gray-800 p-6 rounded-2xl space-y-4">
                    <div class="text-sm text-gray-400">Current Price</div>
                    <div class="text-3xl font-extrabold text-white">0.45 <span class="text-openseaBlue text-lg">MATIC</span></div>
                    <button onclick="alert('Transaction submitted to CEX/Web3 provider network.')" class="w-full bg-openseaBlue hover:bg-openseaHover py-3.5 rounded-xl font-bold transition shadow-lg shadow-blue-500/20">
                        Buy Now
                    </button>
                </div>

                <div class="bg-openseaCard border border-gray-800 rounded-2xl p-6 space-y-3">
                    <h3 class="font-bold text-sm text-gray-300"><i class="fa-solid fa-bars mr-2"></i> Item Details</h3>
                    <div class="flex justify-between text-xs text-gray-400 pt-2 border-t border-gray-700/50">
                        <span>Contract Address</span>
                        <span class="font-mono text-openseaBlue">0x12b4...9f81</span>
                    </div>
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>Token ID</span>
                        <span class="font-mono text-white">0192</span>
                    </div>
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>Blockchain</span>
                        <span class="text-white">Polygon / CEX Feed</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
