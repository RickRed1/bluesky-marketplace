<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore — BlueSky Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        openseaDark: '#04111d',
                        openseaCard: '#262b2f',
                        openseaBlue: '#2081e2',
                        openseaHover: '#1868b7'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-openseaDark text-white font-sans antialiased">
    <nav class="flex items-center justify-between px-6 py-4 border-b border-gray-800 sticky top-0 bg-openseaDark/90 backdrop-blur-md z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 bg-openseaBlue rounded-full flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <span class="text-xl font-bold">BlueSky</span>
        </div>
        <div class="flex items-center space-x-6 text-sm font-medium">
            <a href="index.html" class="hover:text-openseaBlue transition">Home</a>
            <a href="explore.html" class="text-openseaBlue font-bold">Explore</a>
            <a href="profile.html" class="hover:text-openseaBlue transition">Profile</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <h1 class="text-3xl font-extrabold mb-6">Explore Assets & CEX Indices</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-openseaCard rounded-2xl overflow-hidden border border-gray-800 hover:border-openseaBlue transition cursor-pointer" onclick="window.location.href='item.html'">
                <div class="h-64 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1620641788421-7a1c3424e2q=80&w=500&auto=format&fit=crop');"></div>
                <div class="p-4">
                    <span class="text-[10px] text-openseaBlue uppercase tracking-widest font-bold">Polygon Unfiltered</span>
                    <h3 class="font-bold text-base mt-1">Prism Core #0192</h3>
                    <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-700/50 text-sm">
                        <span class="text-gray-400">Price</span>
                        <span class="font-bold text-openseaBlue">0.45 MATIC</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
