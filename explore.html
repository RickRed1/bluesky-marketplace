<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueSky — Decentralized NFT Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        openseaDark: '#04111d',
                        openseaCard: '#262b2f',
                        openseaBlue: '#2081e2',
                        openseaHover: '#1868b7'
                    }
                }
            }
        }

        async function connectWallet() {
            let address;
            try {
                if (typeof window.ethereum !== 'undefined') {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    address = accounts[0];
                } else {
                    const randomWallet = ethers.Wallet.createRandom();
                    address = randomWallet.address;
                    alert(`No Web3 extension detected. Generated test session wallet: ${address.substring(0,6)}...`);
                }
                const shortAddr = address.substring(0, 6) + '...' + address.substring(address.length - 4);
                document.querySelectorAll('.wallet-btn').forEach(btn => {
                    btn.innerHTML = `<i class="fa-solid fa-wallet mr-2"></i> ${shortAddr}`;
                    btn.classList.add('bg-green-600', 'hover:bg-green-700');
                    btn.classList.remove('bg-openseaBlue', 'hover:bg-openseaHover');
                });
            } catch (error) {
                console.error("Connection error", error);
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-openseaDark text-white font-sans antialiased selection:bg-openseaBlue selection:text-white">

    <nav class="flex items-center justify-between px-6 py-4 border-b border-gray-800 sticky top-0 bg-openseaDark/90 backdrop-blur-md z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 bg-openseaBlue rounded-full flex items-center justify-center text-xl font-bold shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <span class="text-xl font-bold tracking-tight">BlueSky</span>
        </div>
        
        <div class="hidden md:flex items-center bg-[#202225] rounded-xl px-4 py-3 w-96 border border-transparent focus-within:border-openseaBlue transition">
            <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3"></i>
            <input type="text" placeholder="Search items, collections, and accounts" class="bg-transparent border-none outline-none text-sm w-full text-gray-200 placeholder-gray-400">
        </div>

        <div class="flex items-center space-x-6 font-medium text-sm">
            <a href="index.html" class="text-openseaBlue font-bold">Home</a>
            <a href="explore.html" class="hover:text-openseaBlue transition">Explore</a>
            <a href="profile.html" class="hover:text-openseaBlue transition">Profile</a>
            <button onclick="connectWallet()" class="wallet-btn bg-openseaBlue hover:bg-openseaHover px-5 py-2.5 rounded-xl font-semibold transition shadow-lg shadow-blue-500/20">
                Connect Wallet
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-16">
        <div class="text-center max-w-3xl mx-auto space-y-6">
            <h1 class="text-5xl font-extrabold tracking-tight">Discover, collect, and sell extraordinary NFTs</h1>
            <p class="text-gray-400 text-lg">The world's first and largest digital marketplace for crypto collectibles and non-fungible tokens.</p>
            <div class="flex justify-center space-x-4 pt-4">
                <a href="explore.html" class="bg-openseaBlue hover:bg-openseaHover px-8 py-3.5 rounded-xl font-bold transition shadow-lg shadow-blue-500/20">Explore</a>
            </div>
        </div>
    </main>
</body>
</html>
