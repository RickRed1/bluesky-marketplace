<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — BlueSky Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        openseaDark: '#04111d',
                        openseaCard: '#262b2f',
                        openseaBlue: '#2081e2',
                        openseaHover: '#1868b7'
                    }
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedWallet = localStorage.getItem('bluesky_wallet');
            if (savedWallet) {
                document.getElementById('wallet-display-address').innerText = savedWallet;
                loadUserAssets(savedWallet);
            }
        });

        function loadUserAssets(address) {
            const grid = document.getElementById('nft-portfolio-grid');
            // Sample payload reflecting your custom asset collections
            const userAssets = [
                { name: "Prism Core #0192", collection: "Polygon Unfiltered", price: "0.45 MATIC", img: "https://images.unsplash.com/photo-1620641788421-7a1c3424e2?q=80&w=500&auto=format&fit=crop" },
                { name: "Hiera-Key Genesis Node", collection: "Decentralized Ledger", price: "1.20 MATIC", img: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=500&auto=format&fit=crop" },
                { name: "Kineto-Acoustic Rotor", collection: "Yield Mechanics", price: "0.85 MATIC", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500&auto=format&fit=crop" }
            ];

            grid.innerHTML = userAssets.map(item => `
                <div class="bg-openseaCard border border-gray-800 rounded-2xl overflow-hidden hover:border-openseaBlue transition cursor-pointer group">
                    <div class="h-64 bg-cover bg-center group-hover:scale-105 transition duration-300" style="background-image: url('${item.img}')"></div>
                    <div class="p-4">
                        <span class="text-[10px] text-openseaBlue uppercase tracking-widest font-bold">${item.collection}</span>
                        <h3 class="font-bold text-base mt-1 mb-2">${item.name}</h3>
                        <div class="flex justify-between items-center pt-3 border-t border-gray-700/50 text-sm">
                            <span class="text-gray-400">Floor / Price</span>
                            <span class="font-bold text-openseaBlue">${item.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-openseaDark text-white font-sans antialiased">
    <nav class="flex items-center justify-between px-6 py-4 border-b border-gray-800 sticky top-0 bg-openseaDark/90 backdrop-blur-md z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 bg-openseaBlue rounded-full flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <span class="text-xl font-bold">BlueSky</span>
        </div>
        <div class="flex items-center space-x-6 text-sm font-medium">
            <a href="index.html" class="hover:text-openseaBlue transition">Home</a>
            <a href="explore.html" class="hover:text-openseaBlue transition">Explore</a>
            <a href="profile.html" class="text-openseaBlue font-bold">Profile</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="mb-8 p-6 bg-openseaCard rounded-2xl border border-gray-800">
            <h1 class="text-3xl font-extrabold mb-2">Connected Profile</h1>
            <p id="wallet-display-address" class="text-xs text-gray-400 font-mono">Connect a wallet via home or explore to index chain assets...</p>
        </div>

        <h2 class="text-xl font-bold mb-4">Your Collected Assets</h2>
        <div id="nft-portfolio-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Assets Injected Here -->
        </div>
    </main>
</body>
</html>
